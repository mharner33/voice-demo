# podman compose -f deploy/compose.yml up -d --build
#
# NOTE on macOS: RTP/UDP from the host crosses the podman VM boundary. The UDP port
# mapping below is required, and host->container UDP can still be finicky. If the client
# can't reach the gateway, run voicectl inside this network instead:
#   podman run --rm --network voice-demo_voicenet ... voicectl
name: voice-demo

services:
  voicegw:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: voicegw
    ports:
      - "${VOICE_RTP_PORT:-5004}:5004/udp"   # RTP media
      - "${VOICE_GRPC_PORT:-50051}:50051"    # gRPC control plane
      - "${VOICE_HTTP_PORT:-8080}:8080"      # /chaos, /healthz, /metrics
    command:
      - "-dd"
      - "-report-interval=10s"
    environment:
      DD_ENV: ${DD_ENV:-demo}
      DD_SERVICE: ${DD_SERVICE:-voicegw}
      DD_VERSION: ${DD_VERSION:-0.1.0}
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
      DD_DOGSTATSD_PORT: "8125"
      DD_LLMOBS_ENABLED: ${DD_LLMOBS_ENABLED:-true}
      DD_LLMOBS_ML_APP: ${DD_LLMOBS_ML_APP:-voice-demo}
      # Speech: mocks unless VOICE_REAL_STT / VOICE_REAL_TTS are true.
      VOICE_REAL_STT: ${VOICE_REAL_STT:-false}
      VOICE_REAL_TTS: ${VOICE_REAL_TTS:-false}
      VOICE_STT_MODEL: ${VOICE_STT_MODEL:-telephony}
      VOICE_STT_LANGUAGE: ${VOICE_STT_LANGUAGE:-en-US}
      VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-en-US-Neural2-C}
      VOICE_TTS_LANGUAGE: ${VOICE_TTS_LANGUAGE:-en-US}
      # The agent: mock unless VOICE_REAL_LLM is true.
      VOICE_REAL_LLM: ${VOICE_REAL_LLM:-false}
      VOICE_LLM_MODEL: ${VOICE_LLM_MODEL:-claude-opus-5}
      VOICE_LLM_EFFORT: ${VOICE_LLM_EFFORT:-low}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The call log goes to stdout so the agent collects it from the container
      # log stream, with no file to mount.
      VOICE_CALL_LOG: "-"
      # The live /chaos endpoint, so a demo can change provider conditions
      # without restarting the container and clearing the dashboard.
      VOICE_HTTP_ADDR: ":8080"
    volumes:
      # drop a GCP service-account JSON here for -real-stt/-real-tts; the dir
      # is gitignored
      - ./secrets:/run/secrets:ro,z
    labels:
      # The call log is JSON lines on stdout; this tells the agent to parse it
      # as JSON so dd.trace_id correlation works.
      com.datadoghq.ad.logs: '[{"source":"go","service":"voicegw"}]'
    depends_on:
      - datadog-agent
    networks: [voicenet]

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-agent
    environment:
      DD_API_KEY: ${DD_API_KEY:?DD_API_KEY is required — copy .env.example to .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-demo}
      DD_HOSTNAME: voice-demo-local
      # APM
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      # DogStatsD
      DD_USE_DOGSTATSD: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      # logs
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
    ports:
      - "8126:8126"   # APM
      - "8125:8125/udp"
    volumes:
      - /var/run/podman/podman.sock:/var/run/docker.sock:ro,z
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks: [voicenet]

networks:
  voicenet:
    driver: bridge
